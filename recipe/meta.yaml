{% set name = "mfusepy" %}
{% set version = "3.1.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 338ece54513d7d1a5e9492837679a0c7432ecf96a03490a2683a1ce1d19570e1

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - __linux

test:
  requires:
    - python {{ python_min }}
  imports:
    - mfusepy

about:
  home: https://github.com/mxmlnkn/mfusepy
  license: ISC
  license_file: LICENSE
  summary: Ctypes bindings for the high-level API in libfuse 2 and 3

extra:
  recipe-maintainers:
    - mxmlnkn
