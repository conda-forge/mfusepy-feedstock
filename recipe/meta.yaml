{% set name = "mfusepy" %}
{% set version = "3.2.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 5e149ef4ce22516996fce232251da7569c2b6bfd9e28b10a7503eae59d88b0d3

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - __linux

test:
  requires:
    - python {{ python_min }}
  imports:
    - mfusepy

about:
  home: https://github.com/mxmlnkn/mfusepy
  license: ISC
  license_file: LICENSE
  summary: Ctypes bindings for the high-level API in libfuse 2 and 3

extra:
  recipe-maintainers:
    - mxmlnkn
